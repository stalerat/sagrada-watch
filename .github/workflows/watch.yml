name: Sagrada Familia ticket watch

# Each run checks the ticket page about every 75 s for ~45 min, then starts the
# next run itself (GitHub's cron is unreliable for new repos). The cron below is
# only a backup in case the chain ever breaks. The chain stops after Nov 23.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a Telegram test message instead of checking"
        type: boolean
        default: false

concurrency:
  group: sagrada-watch
  # a code push replaces the run in progress (cancelled runs don't chain)
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write  # only used to publish probe results to the 'diag' branch
  actions: write   # lets the run start the next run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Probe (one quick check, writes diagnostics)
        if: ${{ !inputs.test_alert }}
        continue-on-error: true
        env:
          LOOP_MINUTES: "0"
          PROBE: "1"
          HEADED: "1"
          CHANNEL: chrome
        run: xvfb-run -a python checker.py
      - name: Publish probe result to 'diag' branch
        if: ${{ !inputs.test_alert }}
        continue-on-error: true
        run: |
          git config user.name watcher && git config user.email watcher@users.noreply.github.com
          git checkout -q --orphan diag && git rm -rfq --cached . > /dev/null
          echo "$(date -u +%FT%TZ) headed real Chrome" >> probe.txt
          git add -f probe.txt $( [ -f probe.png ] && echo probe.png ) && git commit -qm probe && git push -qf origin diag
      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert && '1' || '0' }}
          LOOP_MINUTES: "45"
          INTERVAL_SECONDS: "75"
          HEADED: "1"
          CHANNEL: chrome
        run: xvfb-run -a python checker.py
      - name: Start next run
        if: ${{ !cancelled() && !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Europe/Madrid date +%Y%m%d)" -le 20261123 ]; then
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Past Nov 23 - stopping the chain."
          fi
